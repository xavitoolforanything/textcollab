<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Real-time Collaborative Text Editor</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom scrollbar for minimalist look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }
        /* Hide scrollbar for clean UI where appropriate */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Header Navigation -->
    <header class="border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between bg-white/80 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-10">
        <!-- App Title & Room Identifier -->
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 rounded-lg">
                <i class="fa-solid font-mono fa-pen-nib text-lg"></i>
            </div>
            <div>
                <h1 class="font-semibold text-sm sm:text-base leading-tight tracking-tight">SyncPad</h1>
                <p id="roomDisplay" class="text-xs text-slate-500 dark:text-slate-400 font-mono flex items-center gap-1">
                    <span>Doc:</span>
                    <span id="roomName" class="text-indigo-600 dark:text-indigo-400 font-medium">global</span>
                </p>
            </div>
        </div>

        <!-- Right Side Actions & Settings -->
        <div class="flex items-center space-x-2 sm:space-x-3">
            <!-- Active Users Avatar Stack / Count -->
            <button id="usersToggleBtn" class="flex items-center space-x-2 px-2.5 py-1.5 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300">
                <div class="relative flex items-center">
                    <span class="relative flex h-2.5 w-2.5 mr-1.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    <i class="fa-solid fa-users text-xs mr-1"></i>
                    <span id="onlineCount">1</span>
                </div>
            </button>

            <!-- Room Selector Button -->
            <button id="changeRoomBtn" title="Switch Document Room" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-sm">
                <i class="fa-solid fa-folder-open"></i>
            </button>

            <!-- Copy Text Button -->
            <button id="copyBtn" title="Copy Text to Clipboard" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-sm">
                <i class="fa-regular fa-copy"></i>
            </button>

            <!-- Theme Toggle Button -->
            <button id="themeToggleBtn" title="Toggle Theme" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-sm">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
            </button>

            <!-- User Settings Button -->
            <button id="usernameBtn" class="flex items-center space-x-2 px-2.5 py-1.5 rounded-md border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors text-xs sm:text-sm">
                <div id="userAvatar" class="w-5 h-5 rounded-full bg-indigo-500 text-white flex items-center justify-center text-[10px] font-bold">U</div>
                <span id="usernameDisplay" class="max-w-[80px] sm:max-w-[120px] truncate font-medium">User</span>
            </button>
        </div>
    </header>

    <!-- Active Users Bar (Collapsible/Flyout) -->
    <div id="usersPanel" class="hidden border-b border-slate-200 dark:border-slate-800 bg-slate-100/70 dark:bg-slate-800/50 px-4 py-2 text-xs transition-all">
        <div class="flex items-center justify-between max-w-4xl mx-auto">
            <span class="text-slate-500 dark:text-slate-400 font-medium">Active Collaborators:</span>
            <div id="activeUsersList" class="flex flex-wrap gap-2 items-center">
                <!-- User pills injected via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Toast Notification Banner -->
    <div id="toast" class="fixed bottom-12 right-6 bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 px-4 py-2 rounded-lg shadow-lg text-xs font-medium translate-y-10 opacity-0 transition-all duration-300 z-50 pointer-events-none flex items-center gap-2">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600"></i>
        <span id="toastMessage">Copied to clipboard!</span>
    </div>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col max-w-4xl w-full mx-auto px-4 sm:px-8 py-6">
        <!-- Editor Input Container -->
        <div class="flex-1 flex flex-col relative min-h-[60vh]">
            <textarea id="editor" 
                placeholder="Start typing your minimalist notes, markdown, or text here... Everything syncs in real-time."
                spellcheck="true"
                class="w-full h-full flex-1 bg-transparent border-0 resize-none focus:ring-0 focus:outline-none text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-600 text-base sm:text-lg leading-relaxed font-normal p-0 selection:bg-indigo-500/20"
                autofocus></textarea>
        </div>
    </main>

    <!-- Footer Stats & Status Bar -->
    <footer class="border-t border-slate-200 dark:border-slate-800 px-4 sm:px-8 py-2.5 text-xs text-slate-500 dark:text-slate-400 bg-white/50 dark:bg-slate-900/50 backdrop-blur">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <!-- Left: Save Status -->
            <div class="flex items-center space-x-2">
                <span id="statusIndicator" class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span id="statusText" class="font-mono text-[11px]">Saved</span>
            </div>

            <!-- Right: Text Analytics -->
            <div class="flex items-center space-x-4 font-mono text-[11px]">
                <div><span id="wordCount">0</span> words</div>
                <div><span id="charCount">0</span> characters</div>
            </div>
        </div>
    </footer>

    <!-- Username Selection Modal -->
    <div id="usernameModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 max-w-sm w-full p-6 transition-all transform scale-100">
            <h3 class="text-base font-semibold mb-1 text-slate-900 dark:text-white">Choose your username</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Set a display name so other collaborators can recognize you.</p>
            
            <form id="usernameForm" onsubmit="event.preventDefault(); saveUsername();">
                <div class="mb-4">
                    <input type="text" id="usernameInput" maxlength="20" required placeholder="e.g. Alex, Writer, Guest" 
                           class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeUsernameModal()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700">Cancel</button>
                    <button type="submit" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-medium transition-colors">Save Name</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Room Switcher Modal -->
    <div id="roomModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 max-w-sm w-full p-6 transition-all">
            <h3 class="text-base font-semibold mb-1 text-slate-900 dark:text-white">Switch Document</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Enter a room/document key to join or create a shared document session.</p>
            
            <form id="roomForm" onsubmit="event.preventDefault(); switchRoom();">
                <div class="mb-4">
                    <input type="text" id="roomInput" maxlength="30" required placeholder="e.g. project-notes, draft-1" 
                           class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono">
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeRoomModal()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700">Cancel</button>
                    <button type="submit" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-medium transition-colors">Open Document</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global state
        let db = null;
        let auth = null;
        let currentUser = null;
        let documentDocRef = null;
        let userPresenceDocRef = null;
        let unsubscribeDoc = null;
        let unsubscribePresence = null;

        // Configuration
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'minimalist-editor';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Fallback lightweight config structure placeholder for standalone environments
            apiKey: "AIzaSyDemoPlaceholderOnlyForLocalTesting",
            authDomain: "demo-app.firebaseapp.com",
            projectId: "demo-app",
            storageBucket: "demo-app.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };

        // App Variables
        let currentRoom = getUrlParam('room') || 'global';
        let username = localStorage.getItem('syncpad_username') || generateRandomUsername();
        let isRemoteUpdate = false;
        let saveTimeout = null;
        let presenceInterval = null;

        // UI Elements
        const editor = document.getElementById('editor');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const wordCount = document.getElementById('wordCount');
        const charCount = document.getElementById('charCount');
        const usernameDisplay = document.getElementById('usernameDisplay');
        const userAvatar = document.getElementById('userAvatar');
        const roomName = document.getElementById('roomName');
        const onlineCount = document.getElementById('onlineCount');
        const activeUsersList = document.getElementById('activeUsersList');

        // Helper: Get Query Params
        function getUrlParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Helper: Generate default anonymous display names
        function generateRandomUsername() {
            const adjectives = ['Creative', 'Mindful', 'Swift', 'Silent', 'Bright', 'Calm', 'Clever'];
            const nouns = ['Writer', 'Scribe', 'Editor', 'Author', 'Poet', 'Thinker', 'Typist'];
            const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
            const noun = nouns[Math.floor(Math.random() * nouns.length)];
            return `${adj} ${noun}`;
        }

        // Generate consistent color from string (for user avatars)
        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const colors = ['#6366f1', '#8b5cf6', '#ec4899', '#f43f5e', '#10b981', '#14b8a6', '#06b6d4', '#3b82f6'];
            return colors[Math.abs(hash) % colors.length];
        }

        // Initialize Firebase & Auth
        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Authenticate
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        setupRoomSubscription();
                        setupPresence();
                    }
                });

            } catch (err) {
                console.warn("Firebase initialization error or running in static mode:", err);
                setStatus('offline', 'Local mode (Offline)');
            }
        }

        // Setup Firestore listeners for current room
        function setupRoomSubscription() {
            if (!db || !currentUser) return;

            // Unsubscribe existing listeners if room changes
            if (unsubscribeDoc) unsubscribeDoc();
            if (unsubscribePresence) unsubscribePresence();

            // Firestore Path: /artifacts/{appId}/public/data/rooms/{roomId}
            documentDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoom);

            // Subscribe to document changes
            unsubscribeDoc = onSnapshot(documentDocRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    if (data && typeof data.text === 'string') {
                        // Prevent overwriting local edits if user is actively typing
                        if (editor.value !== data.text) {
                            isRemoteUpdate = true;
                            const selectionStart = editor.selectionStart;
                            const selectionEnd = editor.selectionEnd;
                            
                            editor.value = data.text;
                            
                            // Preserve cursor position as best as possible
                            try {
                                editor.setSelectionRange(selectionStart, selectionEnd);
                            } catch(e) {}

                            updateStats();
                            isRemoteUpdate = false;
                            setStatus('saved', 'Synced');
                        }
                    }
                } else {
                    // Document doesn't exist yet; create blank
                    saveDocumentRemote(editor.value);
                }
            }, (error) => {
                console.error("Doc listener error:", error);
                setStatus('error', 'Sync error');
            });

            // Subscribe to Online Presence
            const presenceCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', `presence_${currentRoom}`);
            
            unsubscribePresence = onSnapshot(presenceCollectionRef, (snapshot) => {
                const now = Date.now();
                const activeUsers = [];
                
                snapshot.forEach((docSnap) => {
                    const userData = docSnap.data();
                    // Consider online if updated in last 45 seconds
                    if (userData.lastSeen && (now - userData.lastSeen) < 45000) {
                        activeUsers.push({ id: docSnap.id, name: userData.username || 'Anonymous' });
                    }
                });

                updatePresenceUI(activeUsers);
            }, (error) => {
                console.error("Presence listener error:", error);
            });
        }

        // Maintain user presence Heartbeat
        function setupPresence() {
            if (!db || !currentUser) return;

            updatePresenceHeartbeat();

            // Heartbeat every 20s
            if (presenceInterval) clearInterval(presenceInterval);
            presenceInterval = setInterval(updatePresenceHeartbeat, 20000);

            // Clean up presence on unload
            window.addEventListener('beforeunload', () => {
                if (userPresenceDocRef) {
                    deleteDoc(userPresenceDocRef).catch(() => {});
                }
            });
        }

        async function updatePresenceHeartbeat() {
            if (!db || !currentUser) return;
            
            userPresenceDocRef = doc(db, 'artifacts', appId, 'public', 'data', `presence_${currentRoom}`, currentUser.uid);
            try {
                await setDoc(userPresenceDocRef, {
                    username: username,
                    lastSeen: Date.now()
                }, { merge: true });
            } catch (e) {
                console.error("Error updating presence:", e);
            }
        }

        // Save Document Text to Firestore
        async function saveDocumentRemote(text) {
            if (!db || !currentUser || isRemoteUpdate) return;

            setStatus('saving', 'Saving...');
            try {
                await setDoc(documentDocRef, {
                    text: text,
                    lastModified: serverTimestamp(),
                    lastModifiedBy: username
                }, { merge: true });
                setStatus('saved', 'Saved');
            } catch (err) {
                console.error("Error saving document:", err);
                setStatus('error', 'Error saving');
            }
        }

        // Update UI Status Indicators
        function setStatus(state, message) {
            statusText.textContent = message;
            statusIndicator.className = "w-2 h-2 rounded-full transition-colors ";
            
            if (state === 'saved') {
                statusIndicator.classList.add('bg-emerald-500');
            } else if (state === 'saving') {
                statusIndicator.classList.add('bg-amber-500', 'animate-pulse');
            } else if (state === 'error') {
                statusIndicator.classList.add('bg-rose-500');
            } else {
                statusIndicator.classList.add('bg-slate-400');
            }
        }

        // Render Online Users UI
        function updatePresenceUI(users) {
            onlineCount.textContent = Math.max(1, users.length);
            activeUsersList.innerHTML = '';

            if (users.length === 0) {
                // Self fallback
                users = [{ id: currentUser?.uid || 'local', name: username }];
            }

            users.forEach(u => {
                const color = stringToColor(u.name);
                const isSelf = u.id === currentUser?.uid;

                const pill = document.createElement('div');
                pill.className = "flex items-center space-x-1.5 px-2 py-0.5 rounded-full bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 shadow-sm text-slate-700 dark:text-slate-200";
                
                const initial = u.name.charAt(0).toUpperCase();
                pill.innerHTML = `
                    <span class="w-3.5 h-3.5 rounded-full text-[9px] font-bold text-white flex items-center justify-center" style="background-color: ${color}">${initial}</span>
                    <span class="font-medium">${escapeHtml(u.name)}${isSelf ? ' (You)' : ''}</span>
                `;
                activeUsersList.appendChild(pill);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Stats calculation
        function updateStats() {
            const text = editor.value || '';
            charCount.textContent = text.length;
            
            // Trim whitespace for accurate word count
            const trimmed = text.trim();
            const words = trimmed ? trimmed.split(/\s+/).length : 0;
            wordCount.textContent = words;
        }

        // Toast Helper
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = msg;
            
            toast.classList.remove('translate-y-10', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-10', 'opacity-0');
            }, 2500);
        }

        // User Customization Functions
        window.saveUsername = function() {
            const input = document.getElementById('usernameInput').value.trim();
            if (input) {
                username = input;
                localStorage.setItem('syncpad_username', username);
                updateUserDisplay();
                updatePresenceHeartbeat();
                closeUsernameModal();
                showToast(`Username set to ${username}`);
            }
        };

        function updateUserDisplay() {
            usernameDisplay.textContent = username;
            userAvatar.textContent = username.charAt(0).toUpperCase();
            userAvatar.style.backgroundColor = stringToColor(username);
        }

        window.closeUsernameModal = function() {
            document.getElementById('usernameModal').classList.add('hidden');
        };

        window.switchRoom = function() {
            const roomInput = document.getElementById('roomInput').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
            if (roomInput) {
                currentRoom = roomInput;
                roomName.textContent = currentRoom;
                
                // Update URL parameter without reload
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + currentRoom;
                window.history.pushState({path: newUrl}, '', newUrl);

                // Reset editor & subscribe to new room
                editor.value = '';
                updateStats();
                setupRoomSubscription();
                updatePresenceHeartbeat();
                closeRoomModal();
                showToast(`Opened document: ${currentRoom}`);
            }
        };

        window.closeRoomModal = function() {
            document.getElementById('roomModal').classList.add('hidden');
        };

        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('syncpad_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('syncpad_theme', isDark ? 'dark' : 'light');
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Text Editing Listener with Debounced Save
            editor.addEventListener('input', () => {
                updateStats();
                setStatus('saving', 'Saving...');

                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    saveDocumentRemote(editor.value);
                }, 400); // 400ms debounce
            });

            // Toggle Theme
            document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);

            // Copy Button
            document.getElementById('copyBtn').addEventListener('click', () => {
                if (!editor.value) return;
                
                // standard fallback execution for copying
                editor.select();
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
                
                showToast('Copied to clipboard!');
            });

            // Username Modal Triggers
            document.getElementById('usernameBtn').addEventListener('click', () => {
                document.getElementById('usernameInput').value = username;
                document.getElementById('usernameModal').classList.remove('hidden');
                document.getElementById('usernameInput').focus();
            });

            // Room Modal Triggers
            document.getElementById('changeRoomBtn').addEventListener('click', () => {
                document.getElementById('roomInput').value = currentRoom;
                document.getElementById('roomModal').classList.remove('hidden');
                document.getElementById('roomInput').focus();
            });

            // Toggle Active Users Panel
            document.getElementById('usersToggleBtn').addEventListener('click', () => {
                const panel = document.getElementById('usersPanel');
                panel.classList.toggle('hidden');
            });
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateUserDisplay();
            roomName.textContent = currentRoom;
            updateStats();
            setupEventListeners();
            initFirebase();
        });
